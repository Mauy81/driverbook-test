<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_reg_passeggero">Registrazione Passeggero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="logo/icon-progressive-web-app-bianco.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 data-i18n="h1_reg_passeggero">Registrazione Passeggero</h1>
            </div>

            <form id="formRegistrazionePasseggero" autocomplete="off" onsubmit="inviaRegistrazionePasseggero(event)">
                
                <div class="form-group">
                    <label class="label" for="nome" data-i18n="label_nome_cognome">Nome e Cognome / Referente</label>
                    <input type="text" id="nome" class="input" required placeholder="Mario Rossi" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="email" data-i18n="label_email_accesso">Email Accesso</label>
                    <input type="email" id="email" class="input" required placeholder="mario@example.com" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="telefono" data-i18n="label_telefono">Telefono Cellulare</label>
                    <input type="tel" id="telefono" class="input" required placeholder="333 1234567" autocomplete="off">
                </div>

                <div class="checkbox-group" id="blocco_fatturazione_registrazione">
                    <input type="checkbox" id="richiedeFattura" class="checkbox-input" onchange="toggleFatturazione()">
                    <label for="richiedeFattura" class="checkbox-label" data-i18n="label_richiede_fattura">Richiedo fatturazione elettronica (Azienda / Hotel)</label>
                </div>

                <div id="sezione_fatturazione" class="gruppo-dinamico hidden">
                    <div class="form-group">
                        <label class="label" for="ragioneSociale" data-i18n="label_ragione_sociale">Ragione Sociale</label>
                        <input type="text" id="ragioneSociale" class="input" placeholder="Es. Hotel Roma SRL" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="piva_cf" data-i18n="label_piva_cf">Partita IVA / Codice Fiscale</label>
                        <input type="text" id="piva_cf" class="input" placeholder="12345678901" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="codice_sdi">
                            <span data-i18n="label_sdi">Codice Destinatario SDI (7 caratteri)</span>
                            <div class="label-nota" data-i18n="nota_sdi">Se non possiedi un codice SDI, inserisci 0000000 (sette zeri) e compila il campo PEC.</div>
                        </label>
                        <input type="text" id="codice_sdi" class="input" maxlength="7" placeholder="Es. M5UXCR1 oppure 0000000" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="pec" data-i18n="label_pec">Indirizzo PEC</label>
                        <input type="email" id="pec" class="input" placeholder="azienda@pec.it" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="indirizzo_via" data-i18n="label_indirizzo_via">Indirizzo Sede Legale (Via e Civico)</label>
                        <input type="text" id="indirizzo_via" class="input" placeholder="Via Roma 10" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="indirizzo_cap" data-i18n="label_cap">CAP</label>
                        <input type="text" id="indirizzo_cap" class="input" maxlength="5" placeholder="20121" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="indirizzo_citta" data-i18n="label_citta">Città</label>
                        <input type="text" id="indirizzo_citta" class="input" placeholder="Milano" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label class="label" for="indirizzo_provincia" data-i18n="label_provincia">Provincia (Sigla)</label>
                        <input type="text" id="indirizzo_provincia" class="input" maxlength="2" placeholder="MI" autocomplete="off">
                    </div>
                </div>

                <div class="form-group" id="blocco_notifiche_registrazione">
                    <label class="label" data-i18n="label_come_notifiche">Come vuoi ricevere le notifiche?</label>
                    <div class="gruppo-dinamico">
                        <div class="checkbox-group">
                            <input type="checkbox" id="notificaPush" class="checkbox-input" checked onchange="validaNotifiche()">
                            <label for="notificaPush" class="checkbox-label">
                                <span data-i18n="label_push">Notifiche Push (Consigliata)</span>
                                <div class="label-nota" data-i18n="nota_push">Istantanea su smartphone e PC.</div>
                            </label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="notificaEmail" class="checkbox-input" onchange="validaNotifiche()">
                            <label for="notificaEmail" class="checkbox-label" data-i18n="label_notifica_email">Email</label>
                        </div>
                    </div>
                    <div id="errore_notifiche" class="error-message" data-i18n="errore_notifiche">Seleziona un metodo.</div>
                </div>

                <div class="form-group">
                    <label class="label" for="password" data-i18n="label_password">Password</label>
                    <div class="pass-box">
                        <input type="password" id="password" class="input" required placeholder="••••••••" autocomplete="new-password" oninput="validaComplessitaPassword(); verificaCoincidenzaPassword();">
                        <button type="button" class="eye-btn" onclick="togglePassword('password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div id="errore_password" class="error-message" data-i18n="errore_password">Minimo 8 caratteri, una maiuscola, una minuscola e un numero.</div>
                </div>

                <div class="form-group">
                    <label class="label" for="confermaPassword" data-i18n="label_conferma_password">Conferma Password</label>
                    <div class="pass-box">
                        <input type="password" id="confermaPassword" class="input" required placeholder="••••••••" autocomplete="new-password" oninput="verificaCoincidenzaPassword()">
                        <button type="button" class="eye-btn" onclick="togglePassword('confermaPassword', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div id="errore_coincidenza" class="error-message" data-i18n="errore_coincidenza">Le password non coincidono.</div>
                </div>

                <div id="messaggio_errore_server" class="error-message" style="margin-bottom: 20px;"></div>

                <button type="submit" class="btn btn-primary btn-full" data-i18n="btn_registrati">Registrati</button>
            </form>
        </div>
    </main>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span data-i18n="btn_chiudi_menu_testo">CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    <div id="ios_install_popup" class="ios-popup hidden">
        <div class="ios-popup-content">
            <span class="close-popup" onclick="chiudiPopupIOS()">&times;</span>
            <p data-i18n="ios_install_1">Per installare l'app su iPhone o iPad:</p>
            <p data-i18n="ios_install_2">1. Tocca l'icona <strong>Condividi</strong> in basso nel browser.</p>
            <p data-i18n="ios_install_3">2. Seleziona <strong>Aggiungi alla schermata Home</strong>.</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
