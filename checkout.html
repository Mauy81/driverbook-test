<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DriverBook - Riepilogo Prenotazione</title>
    <link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="logo/icon-progressive-web-app-bianco.png">
</head>
<body>
    <div id="menu_overlay" class="overlay"></div>
    
    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                CHIUDI MENU
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text">SCORRI PER USCIRE DALL'ACCOUNT<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    <div id="menu-principale"></div>

    <div class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Riepilogo Richiesta</h1>
            </div>

            <div class="auth-header checkout-section-header">
                <h2>Passeggero</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Nome e Cognome</label>
                <div id="view_nome_pax" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Telefono Passeggero</label>
                <div id="view_tel_pax" class="checkout-data-value">-</div>
            </div>

            <div id="blocco_view_referente" class="hidden">
                <div class="auth-header checkout-section-header">
                    <h2>Referente Prenotazione</h2>
                </div>
                <div class="form-group form-group-checkout">
                    <label class="label-nota">Nome Azienda / Referente</label>
                    <div id="view_nome_ref" class="checkout-data-value">-</div>
                </div>
                <div class="form-group form-group-checkout">
                    <label class="label-nota">Telefono Referente</label>
                    <div id="view_tel_ref" class="checkout-data-value">-</div>
                </div>
            </div>

            <div class="auth-header checkout-section-header">
                <h2>Dettagli Servizio</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Tipologia Servizio</label>
                <div id="view_servizio" class="checkout-data-value">-</div>
            </div>
            <div id="blocco_view_ore" class="form-group form-group-checkout hidden">
                <label class="label-nota">Durata Disposizione</label>
                <div id="view_ore" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Vettura Richiesta</label>
                <div id="view_vettura" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Data e Ora Partenza</label>
                <div id="view_data_ora" class="checkout-data-value">-</div>
            </div>

            <div class="auth-header checkout-section-header">
                <h2>Itinerario</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Luogo di Partenza</label>
                <div id="view_partenza" class="checkout-data-value">-</div>
            </div>
            <div id="blocco_view_arrivo" class="form-group form-group-checkout hidden">
                <label class="label-nota">Luogo di Destinazione</label>
                <div id="view_arrivo" class="checkout-data-value">-</div>
            </div>
            <div id="blocco_view_itinerario" class="form-group form-group-checkout hidden">
                <label class="label-nota">Itinerario Previsto</label>
                <div id="view_itinerario" class="checkout-data-value">-</div>
            </div>

            <div id="blocco_view_hub" class="hidden">
                <div class="auth-header checkout-section-header">
                    <h2>Monitoraggio</h2>
                </div>
                <div class="form-group form-group-checkout">
                    <label class="label-nota">Volo / Treno / Nave</label>
                    <div id="view_info_trasporto" class="checkout-data-value">-</div>
                </div>
            </div>

            <div class="auth-header checkout-section-header">
                <h2>Logistica e Note</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Passeggeri e Bagagli</label>
                <div id="view_carico" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota">Note e Richieste Particolari</label>
                <div id="view_note" class="checkout-data-note">-</div>
            </div>

            <div class="auth-header checkout-total-header">
                <h1>Totale</h1>
            </div>
            <div class="form-group form-group-checkout">
                <div id="view_prezzo" class="checkout-total-value">-</div>
            </div>

            <button type="button" class="btn btn-primary btn-full checkout-submit-btn" onclick="confermaPrenotazione()">Invia Richiesta</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
