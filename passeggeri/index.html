<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titolo_pagina">DriverButler - NCC Noleggio Con Conducente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa.png">
    <script>
        (function() {
            const prefix = 'pax_';
            
            if (localStorage.getItem(prefix + 'driverbutler_auth_token')) {
                const lastPage = localStorage.getItem(prefix + 'driverbutler_last_page') || 'dashboard.html';
                window.location.replace(lastPage);
            }
        })();
    </script>
</head>
<body>

    <div id="menu-principale"></div>

    

    <main class="hero-section">
        <h1 class="hero-title">
            <span data-i18n="hero_title_1">Il tuo autista privato</span><br>
            <span data-i18n="hero_title_2">per ogni tua destinazione</span>
        </h1>
        <p class="hero-subtitle" data-i18n="hero_subtitle">
            Prenota trasferimenti e disposizioni orarie per viaggi di piacere o di lavoro<br>
            Il tuo servizio NCC (Noleggio con Conducente) affidabile e discreto
        </p>
        
        <div class="action-buttons">
            <a href="login.html" class="btn btn-primary" data-i18n="btn_entra">Entra in DriverButler</a>
        </div>
    </main>
 
    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
