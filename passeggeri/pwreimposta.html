<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_reimposta_password">Reimposta Password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa.png">
</head>
<body>

    <div id="menu-principale"></div>

    <div class="login-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <h1 data-i18n="h1_reimposta_password">Reimposta Password</h1>
            </div>
            
            <form id="formResetPassword" onsubmit="inviaNuovaPassword(event)">
                <div class="form-group">
                    <label class="label" for="password" data-i18n="label_nuova_password">Nuova Password</label>
                    <div class="pass-box">
                        <input type="password" id="password" class="input" placeholder="••••••••" oninput="validaComplessitaPassword()" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div id="errore_password" class="error-message" data-i18n="errore_password">La password deve avere almeno 8 caratteri, una maiuscola, una minuscola e un numero.</div>
                </div>

                <div class="form-group">
                    <label class="label" for="confermaPassword" data-i18n="label_conferma_nuova_password">Conferma Nuova Password</label>
                    <div class="pass-box">
                        <input type="password" id="confermaPassword" class="input" placeholder="••••••••" oninput="verificaCoincidenzaPassword()" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('confermaPassword', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div id="errore_coincidenza" class="error-message" data-i18n="errore_coincidenza">Le password non coincidono.</div>
                </div>

                <div id="messaggio_errore_server" class="error-message" style="margin-bottom: 15px;"></div>

                <button type="submit" class="btn btn-primary btn-full" id="btn_salva_password" data-i18n="btn_salva_nuova_password">Salva Nuova Password</button>
            </form>

        </div>
    </div>

    

    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
