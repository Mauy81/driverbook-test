<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_checkout">DriverButler - Riepilogo Prenotazione</title>
    <link rel="stylesheet" href="style.css">
	<link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa.png">
</head>
<body>
    

    <div id="menu-principale"></div>

    <div class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 data-i18n="h1_checkout">Riepilogo Richiesta</h1>
            </div>

            <div id="riepilogo_vuoto" class="form-group hidden">
                <span class="label" data-i18n="lbl_nessun_riepilogo">Nessuna richiesta di prenotazione in sospeso.</span>
            </div>

            <div id="contenitore_dati_riepilogo">
            <div class="auth-header checkout-section-header">
                <h2 data-i18n="h2_passeggero">Passeggero</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_nome_cognome_pax">Nome e Cognome</label>
                <div id="view_nome_pax" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_tel_pax">Telefono Passeggero</label>
                <div id="view_tel_pax" class="checkout-data-value">-</div>
            </div>

            <div id="blocco_view_referente" class="hidden">
                <div class="auth-header checkout-section-header">
                    <h2 data-i18n="h2_referente">Referente Prenotazione</h2>
                </div>
                <div class="form-group form-group-checkout">
                    <label class="label-nota" data-i18n="lbl_nome_ref">Nome Azienda / Referente</label>
                    <div id="view_nome_ref" class="checkout-data-value">-</div>
                </div>
                <div class="form-group form-group-checkout">
                    <label class="label-nota" data-i18n="lbl_tel_ref">Telefono Referente</label>
                    <div id="view_tel_ref" class="checkout-data-value">-</div>
                </div>
            </div>

            <div class="auth-header checkout-section-header">
                <h2 data-i18n="h2_dettagli_servizio">Dettagli Servizio</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_tipologia">Tipologia Servizio</label>
                <div id="view_servizio" class="checkout-data-value">-</div>
            </div>
            <div id="blocco_view_ore" class="form-group form-group-checkout hidden">
                <label class="label-nota" data-i18n="lbl_durata">Durata Disposizione</label>
                <div id="view_ore" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_vettura_richiesta">Vettura Richiesta</label>
                <div id="view_vettura" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_data_ora">Data e Ora Partenza</label>
                <div id="view_data_ora" class="checkout-data-value">-</div>
            </div>

            <div class="auth-header checkout-section-header">
                <h2 data-i18n="h2_itinerario">Itinerario</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_partenza">Luogo di Partenza</label>
                <div id="view_partenza" class="checkout-data-value">-</div>
            </div>
            <div id="blocco_view_arrivo" class="form-group form-group-checkout hidden">
                <label class="label-nota" data-i18n="lbl_arrivo">Luogo di Destinazione</label>
                <div id="view_arrivo" class="checkout-data-value">-</div>
            </div>
            <div id="blocco_view_itinerario" class="form-group form-group-checkout hidden">
                <label class="label-nota" data-i18n="lbl_itinerario_previsto">Itinerario Previsto</label>
                <div id="view_itinerario" class="checkout-data-value">-</div>
            </div>

            <div id="blocco_view_hub" class="hidden">
                <div class="auth-header checkout-section-header">
                    <h2 data-i18n="h2_monitoraggio">Monitoraggio</h2>
                </div>
                <div class="form-group form-group-checkout">
                    <label class="label-nota" data-i18n="lbl_volo_treno_nave">Volo / Treno / Nave</label>
                    <div id="view_info_trasporto" class="checkout-data-value">-</div>
                </div>
            </div>

            <div class="auth-header checkout-section-header">
                <h2 data-i18n="h2_logistica">Logistica e Note</h2>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_pax_bagagli">Passeggeri e Bagagli</label>
                <div id="view_carico" class="checkout-data-value">-</div>
            </div>
            <div class="form-group form-group-checkout">
                <label class="label-nota" data-i18n="lbl_note_richieste">Note e Richieste Particolari</label>
                <div id="view_note" class="checkout-data-note">-</div>
            </div>

            <div class="auth-header checkout-total-header">
                <h1 data-i18n="h1_totale">Totale</h1>
            </div>
            <div class="form-group form-group-checkout">
                <div id="view_prezzo" class="checkout-total-value">-</div>
            </div>

            <div class="btn-coppia checkout-submit-btn">
                <button type="button" id="btn_conferma_prenotazione" class="btn" data-i18n="btn_invia_richiesta_checkout">Invia Richiesta</button>
                <button type="button" id="btn_modifica_prenotazione" class="btn" data-i18n="btn_modifica_checkout">Modifica</button>
            </div>
            </div>
        </div>
    </div>

    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
