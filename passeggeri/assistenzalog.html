<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_assistenza">Assistenza - DriverButler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 data-i18n="h1_assistenza">Assistenza</h1>
            </div>
            <form id="form_assistenza_interna" autocomplete="off">
                <div class="form-group hidden">
                    <input type="text" id="azienda_hp_interna" name="azienda_hp" class="input" tabindex="-1" autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="label" for="testo_assistenza_interna" data-i18n="label_descrivi_problema">Descrivi il problema</label>
                    <textarea id="testo_assistenza_interna" class="input" required placeholder="Scrivi qui i dettagli della tua richiesta..."></textarea>
                </div>
                <div id="msg_stato_assistenza_interna" class="error-message error-message-centered"></div>

                <button type="submit" class="btn" data-i18n="btn_invia_richiesta">Invia Richiesta</button>
            </form>
        </div>
    </main>

    

    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
