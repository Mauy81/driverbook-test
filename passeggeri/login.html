<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_login_passeggeri">Accesso Passeggeri</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1 data-i18n="h1_login_passeggeri">Accesso Passeggeri</h1>
            </div>
            
            <div id="messaggio_cambio_email" class="hidden box-messaggio-successo" data-i18n="msg_email_confermata">
                Email confermata con successo. Effettua il login con le tue nuove credenziali.
            </div>

            <form id="formLogin" action="#" method="POST">
                <div id="blocco_dati_login">
                    <div id="messaggio_errore_server_login" class="error-message error-message-server"></div>
                    
                    <div class="form-group">
                        <label class="label" for="email" data-i18n="label_email_accesso">Email Accesso</label>
                    <input type="email" id="email" name="email" class="input" required placeholder="mario@example.com" autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="label" for="password" data-i18n="label_password">Password</label>
                    <div class="pass-box">
                        <input type="password" id="password" name="password" class="input" required placeholder="••••••••" autocomplete="current-password">
                        <button type="button" id="btn_mostra_password" class="eye-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-group form-group-checkbox">
                    <div class="checkbox-group">
                        <input type="checkbox" id="ricordami" class="checkbox-input">
                        <label for="ricordami" class="checkbox-label" data-i18n="label_mantieni_accesso">Mantieni l'accesso su questo dispositivo</label>
                    </div>
                </div>

                <button type="submit" id="btn_invia_login" class="btn btn-primary btn-full" data-i18n="btn_accedi">Accedi</button>
                    <a href="registrazione.html" class="link link-login" data-i18n="link_reg_login">Non hai un account? <strong>Registrati</strong></a>
                </div>
            </form>

            <div id="blocco_verifica_otp_login" class="hidden">
                <p class="auth-subtitle" data-i18n="testo_verifica_otp_login">Il tuo account non è ancora verificato. Inserisci il codice a 6 cifre per attivarlo.</p>
                
                <div class="form-group otp-container">
                    <input type="text" id="otp_code_login" class="input otp-input" maxlength="6" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code">
                </div>

                <div id="messaggio_errore_otp_login" class="error-message error-message-server"></div>

                <button type="button" id="btn_verifica_otp_login" class="btn btn-primary btn-full" data-i18n="btn_verifica_codice">Verifica Codice</button>
                
                <a id="link_invia_nuovo_otp_login" class="link-recupero-otp" data-i18n="link_invia_nuovo_otp">Codice scaduto o non ricevuto? Invia di nuovo</a>
            </div>
        </div>
    </main>
    
    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span data-i18n="btn_chiudi_menu_testo">CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    

    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
