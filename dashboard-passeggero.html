<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title_dash_passeggero">DriverBook - Dashboard Passeggero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="logo/icon-progressive-web-app-bianco.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card" id="card_home_azioni">
            <div class="auth-header">
                <h1 id="welcome_message"><span data-i18n="h1_ciao">Ciao,</span><br><span id="dash_nome_utente">...</span></h1>
            </div>
            
            <div id="container_codice_cliente">
                <div class="label" data-i18n="label_codice_cliente">Codice Cliente:</div>
                <div id="dash_codice_cliente">...</div>
            </div>

            <button class="btn btn-primary btn-full" id="btn_prenota_servizio" data-i18n="btn_prenota_servizio_testo">PRENOTA SERVIZIO</button>
        </div>
    </main>

    <div id="ios_install_popup" class="ios-popup hidden">
        <div class="ios-popup-content">
            <span class="close-popup" id="btn_chiudi_ios_popup">&times;</span>
            <p data-i18n="ios_install_1">Per installare l'app su iPhone o iPad:</p>
            <p data-i18n="ios_install_2">1. Tocca l'icona <strong>Condividi</strong> in basso nel browser.</p>
            <p data-i18n="ios_install_3">2. Seleziona <strong>Aggiungi alla schermata Home</strong>.</p>
        </div>
    </div>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span data-i18n="btn_chiudi_menu_testo">CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span data-i18n="swipe_logout_testo">SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="traduzioni.js"></script>
    <script src="script.js"></script>
</body>
</html>
