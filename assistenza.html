<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistenza - DriverBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="logo/icon-progressive-web-app-bianco.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Assistenza</h1>
            </div>

            <form id="form_assistenza" autocomplete="off" onsubmit="inviaAssistenza(event)">
                <div class="form-group">
                    <label class="label" for="assistenza_email">La tua email</label>
                    <input type="email" id="assistenza_email" class="input" required placeholder="mario@example.com" autocomplete="email">
                </div>
                
                <div class="form-group hidden">
                    <input type="text" id="azienda_hp" name="azienda_hp" class="input" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="testo_assistenza">Descrivi il problema</label>
                    <textarea id="testo_assistenza" class="input" required placeholder="Scrivi qui i dettagli della tua richiesta..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Invia Richiesta</button>
            </form>
        </div>
    </main>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                CHIUDI MENU
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="menu-items scrollable-menu">
            <a href="login-passeggero.html" class="menu-item">Accesso</a>
			<a href="reset-password.html" class="menu-item">Recupero Password</a>
            <a href="registrazione-passeggero.html" class="menu-item">Registrazione</a>
        </div>
    </div>
    
    <div id="ios_install_popup" class="ios-popup hidden">
        <div class="ios-popup-content">
            <span class="close-popup" onclick="chiudiPopupIOS()">&times;</span>
            <p>Per installare l'app su iPhone o iPad:</p>
            <p>1. Tocca l'icona <strong>Condividi</strong> in basso nel browser.</p>
            <p>2. Seleziona <strong>Aggiungi alla schermata Home</strong>.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
