<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriverBook - Dashboard Autista Amministrativo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="logo/icon-progressive-web-app-bianco.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="dashboard-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Dashboard Autista</h1>
            </div>
            
            <button class="btn btn-primary btn-full" style="margin-bottom: 15px;">BOTTONE 1</button>
            <button class="btn btn-primary btn-full">BOTTONE 2</button>
        </div>
    </main>

    <div id="ios_install_popup" class="ios-popup hidden">
        <div class="ios-popup-content">
            <span class="close-popup" onclick="chiudiPopupIOS()">&times;</span>
            <p>Per installare l'app su iPhone o iPad:</p>
            <p>1. Tocca l'icona <strong>Condividi</strong> in basso nel browser.</p>
            <p>2. Seleziona <strong>Aggiungi alla schermata Home</strong>.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
