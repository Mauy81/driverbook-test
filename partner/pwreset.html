<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Reset Password</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body>

    <div id="menu-principale"></div>

    <div class="login-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p style="color: #aaaaaa; font-size: 0.9rem; margin-top: 15px; line-height: 1.5;">
                    Inserisci l'indirizzo email associato al tuo account. Ti invieremo un link per creare una nuova password.
                </p>
            </div>

            <form id="formRecuperoPassword" autocomplete="off" onsubmit="richiediResetPassword(event)">
                <div class="form-group">
                    <label class="label" for="email_recupero">La tua Email</label>
                    <input type="email" id="email_recupero" class="input" required placeholder="mario@example.com">
                </div>

                <div id="msg_recupero" class="error-message" style="text-align: center; margin-bottom: 15px;"></div>

                <button type="submit" id="btn_invia_recupero" class="btn btn-primary btn-full">Invia Link di Recupero</button>
            </form>

        </div>
    </div>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    

    <script src="../traduzioni.js"></script>
    <script src="../script.js"></script>
</body>
</html>
