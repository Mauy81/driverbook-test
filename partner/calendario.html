<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Servizi - DriverBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body class="page-calendario">
    <div id="menu-principale"></div>
	
    <main class="login-wrapper">
        <div class="auth-card" id="card_calendario">
            
            <div class="auth-header">
                <h1>Calendario Servizi</h1>
            </div>

            <div id="lista_servizi_calendario" class="sezione-vetture"></div>

            <template id="template_calendario_card">
                <div class="card-bacheca-minimal">
                    <div class="bacheca-header-touch" data-bind-action="toggle">
                        <div class="bacheca-info-sintesi">
                            <div class="bacheca-riga-intestazione">
                                <div class="bacheca-dati-servizio">
                                    <span class="bacheca-data-evidenziata" data-bind="intestazione_unificata"></span>
                                </div>
                                <div class="bacheca-prezzo-sintesi">
                                    <span class="cal-badge-stato" data-bind="badge_stato"></span>
                                </div>
                            </div>
                            <div class="bacheca-riga-indirizzo">
                                <span class="bacheca-label-indirizzo">DA:</span> <span class="bacheca-valore-indirizzo" data-bind="partenza_sintesi"></span>
                            </div>
                            <div class="bacheca-riga-indirizzo hidden" data-bind-container="arrivo_sintesi_riga">
                                <span class="bacheca-label-indirizzo">A:</span> <span class="bacheca-valore-indirizzo" data-bind="arrivo_sintesi"></span>
                            </div>
                            <div class="bacheca-riga-indirizzo">
                                <span class="bacheca-label-indirizzo">PAX:</span> <span class="bacheca-valore-indirizzo" data-bind="pax_sintesi"></span>
                            </div>
                        </div>
                        <svg class="icona-tendina-mini" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>

                    <div class="bacheca-body-dettaglio">
                        <div class="checkout-style-block" style="margin-top: 15px;">
                            <div class="bacheca-sezione-titolo">PASSEGGERO</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Nome e Cognome</span>
                                <span class="checkout-style-value" data-bind="nome_passeggero"></span>
                            </div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Telefono Passeggero</span>
                                <span class="checkout-style-value" data-bind="tel_passeggero"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block hidden" data-bind-container="referente_block">
                            <div class="bacheca-sezione-titolo">REFERENTE PRENOTAZIONE</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Nome Azienda / Referente</span>
                                <span class="checkout-style-value" data-bind="nome_referente"></span>
                            </div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Telefono Referente</span>
                                <span class="checkout-style-value" data-bind="tel_referente"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block">
                            <div class="bacheca-sezione-titolo">DETTAGLI SERVIZIO</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Tipologia Servizio</span>
                                <span class="checkout-style-value" data-bind="tipo_servizio_full"></span>
                            </div>
                            <div class="checkout-style-row hidden" data-bind-container="durata_block">
                                <span class="checkout-style-label">Durata Disposizione</span>
                                <span class="checkout-style-value" data-bind="durata"></span>
                            </div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Vettura Richiesta</span>
                                <span class="checkout-style-value" data-bind="vettura_full"></span>
                            </div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Data e Ora Partenza</span>
                                <span class="checkout-style-value" data-bind="data_ora_dettaglio"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block">
                            <div class="bacheca-sezione-titolo">ITINERARIO</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Luogo di Partenza</span>
                                <span class="checkout-style-value" data-bind="partenza_full"></span>
                            </div>
                            <div class="checkout-style-row hidden" data-bind-container="arrivo_full_block">
                                <span class="checkout-style-label">Luogo di Destinazione</span>
                                <span class="checkout-style-value" data-bind="arrivo_full"></span>
                            </div>
                            <div class="checkout-style-row hidden" data-bind-container="itinerario_previsto_block">
                                <span class="checkout-style-label">Itinerario Previsto</span>
                                <span class="checkout-style-value" data-bind="itinerario_previsto"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block">
                            <div class="bacheca-sezione-titolo">LOGISTICA E NOTE</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Passeggeri e Bagagli</span>
                                <span class="checkout-style-value"><span data-bind="pax"></span><br><span data-bind="grandi"></span><br><span data-bind="mano"></span> Trolley</span>
                            </div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Note e Richieste Particolari</span>
                                <span class="checkout-style-value" data-bind="note_servizio"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block">
                            <div class="checkout-style-row bacheca-riga-codice">
                                <span class="checkout-style-label">CODICE PRENOTAZIONE:</span>
                                <span class="checkout-style-value bacheca-valore-codice" data-bind="codice_prenotazione_dettaglio"></span>
                            </div>
                            <div class="checkout-style-row bacheca-riga-prezzo">
                                <span class="checkout-style-value bacheca-valore-prezzo" data-bind="prezzo_dettaglio"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </main>

    <div id="barra_data_calendario">
        <div class="calendario-nav-container">
            <button type="button" class="btn-freccia-calendario" id="btn_giorno_prec">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="data-selezionata-container">
                <span id="testo_data_selezionata"></span>
                <input type="date" id="input_data_calendario" class="input-data-nascosto">
            </div>
            <button type="button" class="btn-freccia-calendario" id="btn_giorno_succ">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span>SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
