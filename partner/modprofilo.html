<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifica Profilo - DriverBook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body>
    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card" id="card_profilo">
            <div class="auth-header">
                <h1>Modifica Profilo</h1>
            </div>
            <form id="formModificaProfilo">
                
                <div class="form-group">
                    <label class="label" for="profilo_nome">Nome e Cognome / Referente</label>
                    <input type="text" id="profilo_nome" class="input" placeholder="Mario Rossi" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label class="label" for="profilo_email">Email Accesso</label>
                    <input type="email" id="profilo_email" class="input" placeholder="mario@example.com" required autocomplete="email">
                    <div class="label-nota">La modifica dell'email richiederà la conferma tramite un link inviato al nuovo indirizzo.</div>
                </div>
                
                <div class="form-group">
                    <label class="label" for="profilo_telefono">Telefono Cellulare</label>
                    <input type="tel" id="profilo_telefono" class="input" required placeholder="333 1234567" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_ragioneSociale">Ragione Sociale</label>
                    <input type="text" id="profilo_ragioneSociale" class="input" required placeholder="Rossi NCC di ... / Driver SRL" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_piva">Partita IVA</label>
                    <input type="text" id="profilo_piva" class="input" required placeholder="12345678901" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_codice_sdi">
                        <span>Codice Destinatario SDI (7 caratteri)</span>
                        <div class="label-nota">Se non possiedi un codice SDI, inserisci 0000000 (sette zeri) e compila il campo PEC.</div>
                    </label>
                    <input type="text" id="profilo_codice_sdi" class="input" required maxlength="7" placeholder="Es. M5UXCR1 oppure 0000000" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_pec">Indirizzo PEC</label>
                    <input type="email" id="profilo_pec" class="input" required placeholder="azienda@pec.it" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_indirizzo_via">Indirizzo Sede Legale (Via e Civico)</label>
                    <input type="text" id="profilo_indirizzo_via" class="input" required placeholder="Via Roma 10" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_indirizzo_cap">CAP</label>
                    <input type="text" id="profilo_indirizzo_cap" class="input" required maxlength="5" placeholder="20121" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_indirizzo_citta">Città</label>
                    <input type="text" id="profilo_indirizzo_citta" class="input" required placeholder="Milano" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_indirizzo_provincia">Provincia (Sigla)</label>
                    <input type="text" id="profilo_indirizzo_provincia" class="input" required maxlength="2" placeholder="MI" autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label class="label" for="profilo_iban">
                        <span>IBAN</span>
                        <div class="label-nota">Richiesto per ricevere i pagamenti dei servizi.</div>
                    </label>
                    <input type="text" id="profilo_iban" class="input" required placeholder="IT00A0000000000000000000000" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_intestatario_conto">Intestatario Conto</label>
                    <input type="text" id="profilo_intestatario_conto" class="input" required placeholder="Mario Rossi / Driver SRL" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_ruoloConducenti">N° Ruolo e Provincia</label>
                    <input type="text" id="profilo_ruoloConducenti" class="input" required placeholder="1234 - Milano" autocomplete="off">
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <div class="checkbox-group">
                        <input type="checkbox" id="profilo_autocertificazioneKb" class="checkbox-input" required>
                        <label for="profilo_autocertificazioneKb" class="checkbox-label">Dichiaro di possedere patente B valida e abilitazione CAP/KB (Art. 46-47 DPR 445/2000)</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="label" for="profilo_zonaOperativa">
                        <span>Zona Operativa</span>
                        <div class="label-nota">Indica l'area di lavoro principale, non l'autorizzazione o la sede.</div>
                    </label>
                    <input type="text" id="profilo_zonaOperativa" class="input" required placeholder="Malpensa" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label">Come vuoi ricevere le notifiche?</label>
                    <div class="gruppo-dinamico">
                        <div class="checkbox-group">
                            <input type="checkbox" id="profilo_notificaPush" class="checkbox-input" checked>
                            <label for="profilo_notificaPush" class="checkbox-label">
                                <span>Notifiche Push (Consigliata)</span>
                                <div class="label-nota">Istantanea su smartphone e PC.</div>
                            </label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="profilo_notificaEmail" class="checkbox-input">
                            <label for="profilo_notificaEmail" class="checkbox-label">Email</label>
                        </div>
                    </div>
                    <div id="errore_notifiche_dashboard" class="error-message">Seleziona almeno un metodo per ricevere le notifiche.</div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="btn_salva_profilo">Salva Modifiche Profilo</button>
            </form>
        </div>
    </main>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span>SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDYtn-SaUnB4JjkC9fKYEGBKfUDRxiVRMM&libraries=places"></script>
    
    <script src="script.js"></script>
</body>
</html>
