<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Flotta - DriverBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body class="page-flotta">
    <div id="menu-principale"></div>
	
    <main class="login-wrapper">
        <div class="auth-card" id="card_flotta">
            
            <div class="auth-header">
                <h1>Gestione Flotta</h1>
            </div>

            <div id="sezione_elenco_veicoli" class="sezione-vetture"></div>

            <div id="barra_aggiungi_veicolo">
                <button type="button" class="btn btn-primary">Aggiungi veicolo</button>
            </div>

            <div id="form_container_veicolo" class="hidden">
                <div class="auth-header">
                    <h2 id="titolo_form_veicolo">Nuovo Veicolo</h2>
                </div>
                
                <form id="formGestioneVeicolo">
                    <div class="form-group">
                        <label class="label" for="veicolo_modello">Modello Vettura</label>
                        <select id="veicolo_modello" class="input" required>
                            <option value="" disabled selected>Seleziona modello...</option>
                            <option value="CLASSE_V">Classe V</option>
                            <option value="CLASSE_E">Classe E</option>
                            <option value="CLASSE_S">Classe S</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="gruppo_posti_v">
                        <label class="label" for="veicolo_posti">Posti Passeggeri effettivi</label>
                        <select id="veicolo_posti" class="input" required>
                            <option value="" disabled selected>Seleziona posti...</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="label" for="veicolo_targa">Targa Veicolo</label>
                        <input type="text" id="veicolo_targa" class="input input-targa" required placeholder="Es. AB 123 CD" autocomplete="off">
                    </div>

                    <div class="form-group form-group-autocert">
                        <label class="label label-autocert">Autocertificazioni Obbligatorie</label>
                        
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_destinazione" class="checkbox-input" required>
                            <label for="autocert_destinazione" class="checkbox-label">Dichiaro che il veicolo è immatricolato per "uso di terzi da locazione con conducente" (NCC), come indicato sulla Carta di Circolazione.</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_assicurazione" class="checkbox-input" required>
                            <label for="autocert_assicurazione" class="checkbox-label">Dichiaro che il veicolo è in regola con la revisione annuale e dispone di specifica assicurazione per il trasporto passeggeri (NCC).</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_autorizzazione" class="checkbox-input" required>
                            <label for="autocert_autorizzazione" class="checkbox-label">Dichiaro che il veicolo è associato a una regolare autorizzazione NCC in corso di validità.</label>
                        </div>
                    </div>

                    <div class="form-bottoni-veicolo">
                        <button type="submit" class="btn btn-primary btn-veicolo-azione" id="btn_salva_veicolo">SALVA</button>
                        <button type="button" class="btn btn-ghost btn-veicolo-azione" id="btn_annulla_veicolo">ANNULLA</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span>SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
