<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Flotta - DriverBook</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body>
    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card" id="card_flotta">
            
            <div class="auth-header">
                <h1>Gestione Flotta</h1>
            </div>

            <div id="sezione_elenco_veicoli" class="sezione-vetture">
                
                <div class="vettura-card" style="padding: 12px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 15px; font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        <span>CLASSE V</span>
                        <span>7 POSTI</span>
                    </div>
                    <div style="font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        AB 123 CD
                    </div>
                </div>

                <div class="vettura-card" style="padding: 12px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 15px; font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        <span>CLASSE V</span>
                        <span>6 POSTI</span>
                    </div>
                    <div style="font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        XY 987 ZK
                    </div>
                </div>

                <div class="vettura-card" style="padding: 12px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 15px; font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        <span>CLASSE E</span>
                    </div>
                    <div style="font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        EF 987 GH
                    </div>
                </div>

                <div class="vettura-card" style="padding: 12px 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 15px; font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        <span>CLASSE S</span>
                    </div>
                    <div style="font-weight: bold; font-size: 1rem; color: #ffffff; text-transform: uppercase;">
                        ZA 456 XX
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-primary btn-full" id="btn_apri_aggiungi">+ Aggiungi Veicolo</button>

            <div id="form_container_veicolo" class="hidden" style="margin-top: 25px; border-top: 1px solid #333333; padding-top: 25px;">
                <div class="auth-header">
                    <h2>Nuovo Veicolo</h2>
                </div>
                
                <form id="formGestioneVeicolo">
                    <div class="form-group">
                        <label class="label" for="veicolo_modello">Modello Vettura</label>
                        <select id="veicolo_modello" class="input" required>
                            <option value="" disabled selected>Seleziona modello...</option>
                            <option value="CLASSE_V">Classe V</option>
                            <option value="CLASSE_E">Classe E</option>
                            <option value="CLASSE_S">Classe S</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="gruppo_posti_v">
                        <label class="label" for="veicolo_posti">Posti Passeggeri effettivi</label>
                        <select id="veicolo_posti" class="input">
                            <option value="4">4 Posti (Configurazione VIP)</option>
                            <option value="5">5 Posti</option>
                            <option value="6">6 Posti</option>
                            <option value="7" selected>7 Posti (Standard)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="label" for="veicolo_targa">Targa Veicolo</label>
                        <input type="text" id="veicolo_targa" class="input" required placeholder="Es. AB 123 CD" autocomplete="off" style="text-transform: uppercase;">
                    </div>

                    <div class="form-group" style="margin-top: 30px; margin-bottom: 25px;">
                        <label class="label" style="font-weight: bold; border-bottom: 1px solid #333333; padding-bottom: 10px; margin-bottom: 15px;">Autocertificazioni Obbligatorie</label>
                        
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_destinazione" class="checkbox-input" required>
                            <label for="autocert_destinazione" class="checkbox-label">Dichiaro che il veicolo ha destinazione d'uso "Locazione con conducente" (NCC) sulla Carta di Circolazione.</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_assicurazione" class="checkbox-input" required>
                            <label for="autocert_assicurazione" class="checkbox-label">Dichiaro copertura assicurativa idonea per NCC e revisione periodica in regola.</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_autorizzazione" class="checkbox-input" required>
                            <label for="autocert_autorizzazione" class="checkbox-label">Dichiaro regolare autorizzazione NCC e manlevo DriverBook da ogni responsabilità.</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full" id="btn_salva_veicolo">Verifica e Salva</button>
                    <button type="button" class="btn btn-ghost btn-full" id="btn_annulla_veicolo" style="margin-top: 15px;">Annulla</button>
                </form>
            </div>

        </div>
    </main>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span data-i18n="btn_chiudi_menu_testo">CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span data-i18n="swipe_logout_testo">SCORRI PER USCIRE DALL'ACCOUNT</span></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const btnApri = document.getElementById('btn_apri_aggiungi');
            const btnAnnulla = document.getElementById('btn_annulla_veicolo');
            const formContainer = document.getElementById('form_container_veicolo');
            const selectModello = document.getElementById('veicolo_modello');
            const gruppoPostiV = document.getElementById('gruppo_posti_v');

            btnApri.addEventListener('click', () => {
                formContainer.classList.remove('hidden');
                btnApri.classList.add('hidden');
            });

            btnAnnulla.addEventListener('click', () => {
                formContainer.classList.add('hidden');
                btnApri.classList.remove('hidden');
            });

            selectModello.addEventListener('change', function() {
                if (this.value === 'CLASSE_V') {
                    gruppoPostiV.classList.remove('hidden');
                } else {
                    gruppoPostiV.classList.add('hidden');
                }
            });
        });
    </script>
    <script src="../traduzioni.js"></script>
    <script src="../script.js"></script>
</body>
</html>
