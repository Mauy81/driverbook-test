<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistenza - DriverButler</title>
    <link rel="stylesheet" href="style_prt.css">
    <link rel="manifest" href="manifest_prt.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Assistenza</h1>
            </div>

            <form id="form_assistenza" autocomplete="off">
                <div class="form-group">
                    <label class="label" for="assistenza_email">La tua email</label>
                    <input type="email" id="assistenza_email" class="input" required placeholder="mario@example.com" autocomplete="email">
                </div>
                
                <div class="form-group hidden">
                    <input type="text" id="azienda_hp" name="azienda_hp" class="input" tabindex="-1" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="label" for="testo_assistenza">Descrivi il problema</label>
                    <textarea id="testo_assistenza" class="input" required placeholder="Scrivi qui i dettagli della tua richiesta..."></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Invia Richiesta</button>
            </form>
        </div>
    </main>

    
    
    

    
    <script src="script_prt.js"></script>
</body>
</html>
