<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bacheca Richieste - DriverBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="menu-principale"></div>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span>SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    <div class="login-wrapper">
        <div class="authorization-card" style="overflow-y: scroll;">
            <h1 class="titolo-sezione">Bacheca Richieste</h1>
            <p class="sottotitolo-sezione" style="text-align: center; margin-bottom: 20px; color: #aaaaaa; font-size: 0.9em;">
                Qui compaiono le nuove richieste nel raggio di 80 km. Il primo che accetta si aggiudica il servizio.
            </p>

            <div id="contenitore_bacheca">
                <div style="text-align: center; color: #888888; padding: 40px 20px;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px; opacity: 0.5;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <br>In attesa di nuove richieste...
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
