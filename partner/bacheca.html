<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bacheca Richieste - DriverBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="menu-principale"></div>

    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <div class="swipe-logout-container">
                <div class="swipe-logout-track">
                    <span class="swipe-logout-text"><span>SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-left: 5px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span>
                    <input type="range" id="swipe_logout_range" class="swipe-logout-slider" min="0" max="100" value="0">
                </div>
            </div>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>

    <main class="login-wrapper">
        <div class="auth-card" id="card_bacheca_richieste">
            <div class="auth-header">
                <h1>Bacheca Richieste</h1>
            </div>

            <div id="contenitore_bacheca">
                <div style="text-align: center; color: #888888; padding: 40px 20px;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px; opacity: 0.5;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <br>In attesa di nuove richieste...
                </div>
            </div>

            <template id="template_bacheca_card">
                <div class="card-viaggio">
                    <div class="viaggio-header-touch" data-bind-action="toggle">
                        <div class="viaggio-header-info">
                            <span class="viaggio-data" data-bind="data_ora"></span>
                            <span class="viaggio-badge badge-attesa" data-bind="prezzo"></span>
                        </div>
                        <svg class="icona-tendina" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>

                    <div class="viaggio-dettaglio-body">
                        <div class="checkout-style-block">
                            <div class="checkout-style-title">DETTAGLI SERVIZIO</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Tipologia Servizio</span>
                                <span class="checkout-style-value" data-bind="tipo_servizio"></span>
                            </div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Vettura Richiesta</span>
                                <span class="checkout-style-value" data-bind="vettura"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block">
                            <div class="checkout-style-title">ITINERARIO</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Partenza</span>
                                <span class="checkout-style-value" data-bind="partenza"></span>
                            </div>
                            <div class="checkout-style-row" data-bind-container="arrivo" style="display: none;">
                                <span class="checkout-style-label">Arrivo</span>
                                <span class="checkout-style-value" data-bind="arrivo"></span>
                            </div>
                        </div>

                        <div class="checkout-style-block">
                            <div class="checkout-style-title">LOGISTICA</div>
                            <div class="checkout-style-row">
                                <span class="checkout-style-label">Passeggeri e Bagagli</span>
                                <span class="checkout-style-value"><span data-bind="pax"></span> Pax, <span data-bind="grandi"></span> Grandi, <span data-bind="mano"></span> Trolley</span>
                            </div>
                        </div>

                        <button data-bind-action="accetta" class="btn btn-primary btn-full">ACCETTA CORSA</button>
                    </div>
                </div>
            </template>
            
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
