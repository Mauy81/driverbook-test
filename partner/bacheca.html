<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bacheca Richieste - DriverBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="menu-principale"></div>

    <div class="menu-overlay" id="menu_overlay"></div>
    <div class="side-panel" id="side_panel">
        <div class="side-panel-header">
            <img src="../logo/logo-bianco.png" alt="DriverBook" class="side-panel-logo">
            <button class="close-btn" id="btn_chiudi_menu">&times;</button>
        </div>
        <div class="scrollable-menu"></div>
        <div class="side-panel-footer">
            <div class="swipe-logout-container">
                <input type="range" min="0" max="100" value="0" class="swipe-logout-slider" id="swipe_logout_range">
                <span class="swipe-logout-text"><span>SCORRI PER USCIRE DALL'ACCOUNT</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
            </div>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="authorization-card" style="overflow-y: scroll;">
            <h1 class="titolo-sezione">Bacheca Richieste</h1>
            <p class="sottotitolo-sezione" style="text-align: center; margin-bottom: 20px; color: #aaaaaa; font-size: 0.9em;">
                Qui compaiono le nuove richieste nel raggio di 80 km. Il primo che accetta si aggiudica il servizio.
            </p>

            <div id="contenitore_bacheca">
                <div style="text-align: center; color: #888888; padding: 40px 20px;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px; opacity: 0.5;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <br>In attesa di nuove richieste...
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
