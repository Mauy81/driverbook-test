<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DriverButler</title>
    <link rel="stylesheet" href="style_prt.css">
    <link rel="manifest" href="manifest_prt.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body>

    <div id="menu-principale"></div>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Partner Login</h1>
            </div>
            
            <div id="blocco_dati_login">
                <form id="formLogin" action="#" method="POST">
                    <div class="form-group">
                        <label class="label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="input" required placeholder="mario@example.com" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="label" for="password">Password</label>
                        <div class="pass-box">
                            <input type="password" id="password" name="password" class="input" required placeholder="••••••••" autocomplete="current-password">
                            <button type="button" class="eye-btn" data-target-input="password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group margine-inferiore-25">
                        <div class="checkbox-group">
                            <input type="checkbox" id="ricordami" class="checkbox-input">
                            <label for="ricordami" class="checkbox-label">Mantieni l'accesso su questo dispositivo</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                    <a href="registrazione_prt.html" class="link link-login">Non hai un account? <strong>Registrati</strong></a>
                </form>
            </div>

            <div id="blocco_verifica_otp_login" class="hidden">
                <p class="testo-descrittivo-auth margine-inferiore-20">Il tuo account non è ancora verificato. Inserisci il codice a 6 cifre per attivarlo.</p>
                <div class="form-group">
                    <label class="label" for="otp_code_login">Codice di Verifica (6 cifre)</label>
                    <input type="text" id="otp_code_login" class="input input-otp" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="123456" autocomplete="one-time-code">
                </div>
                <div id="messaggio_errore_otp_login" class="error-message msg-centrato-spaziato hidden"></div>
                <button type="button" id="btn_verifica_otp_login" class="btn btn-primary btn-full">Verifica Codice</button>
                <a href="#" id="link_invia_nuovo_otp_login" class="link link-login">Codice scaduto o non ricevuto? Invia di nuovo</a>
            </div>
        </div>
    </main>
    
    <div id="menu_overlay" class="overlay"></div>

    <div id="side_panel" class="side-panel">
        <div class="sidebar-sticky-header">
            <button id="btn_chiudi_menu" class="btn-chiudi-testuale">
                <span>CHIUDI MENU</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>
        <div class="menu-items scrollable-menu"></div>
    </div>
	
    <script src="script_prt.js"></script>
</body>
</html>
