<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner DriverButler</title>
    <link rel="stylesheet" href="style_prt.css">
    <link rel="manifest" href="manifest_prt.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
    <script>
        (function() {
            const prefix = 'prt_';
            
            if (localStorage.getItem(prefix + 'driverbutler_auth_token')) {
                const lastPage = localStorage.getItem(prefix + 'driverbutler_last_page') || 'dashboard_prt.html';
                window.location.replace(lastPage);
            }
        })();
    </script>
</head>
<body>

    <div id="menu-principale"></div>

    <main class="hero-section">
        <h1 class="hero-title">
            <span>Riempi la tua agenda</span><br>
            <span>e fai crescere il tuo lavoro</span>
        </h1>
        <p class="hero-subtitle">
            Unisciti a DriverButler per ricevere richieste di trasferimento ogni giorno.<br>
            Un'unica piattaforma per acquisire nuovi clienti, avere più servizi e gestire il tuo business NCC.
        </p>
        
        <div class="action-buttons">
            <a href="login_prt.html" class="btn btn-primary">Entra in DriverButler</a>
        </div>
    </main>

    <script src="script_prt.js"></script>
</body>
</html>
