<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Flotta - DriverButler</title>
    <link rel="stylesheet" href="style_prt.css">
    <link rel="manifest" href="manifest_prt.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="../logo/icona-pwa-prt.png">
</head>
<body class="page-flotta">
    <div id="menu-principale"></div>
	
    <main class="login-wrapper">
        <div class="auth-card" id="card_flotta">
            
            <div class="auth-header">
                <h1>Gestione Flotta</h1>
            </div>

            <div id="sezione_elenco_veicoli" class="sezione-vetture"></div>

            <div id="form_container_veicolo" class="hidden">
                <div class="auth-header">
                    <h2 id="titolo_form_veicolo">Nuovo Veicolo</h2>
                </div>
                
                <form id="formGestioneVeicolo">
                    <div class="form-group">
                        <label class="label" for="veicolo_modello">Modello Vettura</label>
                        <select id="veicolo_modello" class="input" required>
                            <option value="" disabled selected>Seleziona modello...</option>
                            <option value="CLASSE V">Classe V</option>
                            <option value="CLASSE E">Classe E</option>
                            <option value="CLASSE S">Classe S</option>
                        </select>
                    </div>

                    <div class="form-group hidden" id="gruppo_posti_v">
                        <label class="label" for="veicolo_posti">Posti Passeggeri effettivi</label>
                        <select id="veicolo_posti" class="input" required>
                            <option value="" disabled selected>Seleziona passeggeri...</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="label" for="veicolo_targa">Targa Veicolo</label>
                        <input type="text" id="veicolo_targa" class="input input-targa" required placeholder="Es. AB 123 CD" autocomplete="off">
                    </div>

                    <div class="form-group form-group-autocert">
                        <label class="label label-autocert">Autocertificazioni Obbligatorie</label>
                        
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_destinazione" class="checkbox-input" required>
                            <label for="autocert_destinazione" class="checkbox-label">Dichiaro che il veicolo è immatricolato per "uso di terzi da locazione con conducente" (NCC), come indicato sulla Carta di Circolazione.</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_assicurazione" class="checkbox-input" required>
                            <label for="autocert_assicurazione" class="checkbox-label">Dichiaro che il veicolo è in regola con la revisione annuale e dispone di specifica assicurazione per il trasporto passeggeri (NCC).</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="autocert_autorizzazione" class="checkbox-input" required>
                            <label for="autocert_autorizzazione" class="checkbox-label">Dichiaro che il veicolo è associato a una regolare autorizzazione NCC in corso di validità.</label>
                        </div>
                    </div>

                    <div id="msg_stato_veicolo" class="error-message msg-centrato-spaziato"></div>

                    <div class="btn-coppia form-bottoni-veicolo">
                        <button type="button" class="btn" id="btn_annulla_veicolo">ANNULLA</button>
                        <button type="submit" class="btn" id="btn_salva_veicolo">SALVA</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <div id="bottom_bar_flotta" class="bottom-bar">
        <button type="button" class="btn">AGGIUNGI VEICOLO</button>
    </div>

    
    
    <template id="template_card_veicolo">
        <div class="card-bacheca-minimal" data-targa="">
            <div class="bacheca-header-touch" data-bind-action="toggle">
                <div class="bacheca-info-sintesi">
                    <div class="bacheca-riga-intestazione">
                        <div class="bacheca-dati-servizio">
                            <span class="bacheca-data-evidenziata" data-bind="intestazione_veicolo"></span>
                        </div>
                    </div>
                </div>
                <svg class="icona-tendina-mini" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>

            <div class="bacheca-body-dettaglio">
                <div class="checkout-style-block margine-bacheca-dettaglio">
                    <div class="checkout-style-value">Vuoi eliminare questo veicolo dalla flotta?</div>
                    <div class="btn-coppia form-bottoni-veicolo margine-bottoni-dettaglio">
                        <button type="button" data-bind-action="annulla_elimina" class="btn testo-piccolo">NO</button>
                        <button type="button" data-bind-action="conferma_elimina" class="btn testo-piccolo">SI</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="script_prt.js"></script>
</body>
</html>
